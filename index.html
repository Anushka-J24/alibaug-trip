<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alibaug Trip – Expense Split</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#1d2a2e; --muted:#6b7679; --line:#e6e2d9;
    --sea:#0f6e74; --sea-soft:#e2f1f0; --pos:#1f7a3f; --neg:#b3412c; --sand:#f2e6cf;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#141a1b; --card:#1d2526; --ink:#e9eeee; --muted:#9aa6a7; --line:#2c3638;
      --sea:#5fc0c2; --sea-soft:#1f3436; --pos:#6fd08f; --neg:#f08a74; --sand:#2b2a24;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 80px}
  header h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:13px}
  .total{margin:14px 0 6px;display:flex;gap:10px}
  .total div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .total small{display:block;color:var(--muted);font-size:12px}
  .total b{font-size:20px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--line);gap:10px}
  .row:first-child{border-top:0}
  .name{font-weight:600}
  .sub{color:var(--muted);font-size:12.5px}
  .pos{color:var(--pos);font-weight:600}
  .neg{color:var(--neg);font-weight:600}
  .settle .row{background:var(--sea-soft)}
  .arrow{color:var(--sea);font-weight:700}
  .exp{cursor:pointer}
  .exp:active{background:var(--sand)}
  .amt{font-weight:700;white-space:nowrap}
  .empty{padding:18px 14px;color:var(--muted);text-align:center}
  .fab{position:fixed;right:18px;bottom:18px;background:var(--sea);color:#fff;border:0;border-radius:999px;
    padding:14px 20px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  @media (prefers-color-scheme: dark){.fab{color:#0d1617}}
  .note{font-size:12.5px;color:var(--muted);margin-top:8px}
  .banner{background:var(--sand);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;display:none}
  /* sheet */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
  .overlay.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px 22px;max-height:92vh;overflow:auto}
  .sheet h3{margin:0 0 12px;font-size:18px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit}
  .chip.on{background:var(--sea);border-color:var(--sea);color:#fff}
  @media (prefers-color-scheme: dark){.chip.on{color:#0d1617}}
  .btns{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:600}
  .primary{background:var(--sea);color:#fff}
  @media (prefers-color-scheme: dark){.primary{color:#0d1617}}
  .ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  .danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
  .err{color:var(--neg);font-size:13px;margin-top:8px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌊 Alibaug Trip</h1>
    <p>Arnab · Anushka · Dhruti — shared expense split</p>
  </header>

  <div class="banner" id="banner"></div>

  <div class="total">
    <div><small>Total spent</small><b id="tTotal">₹0</b></div>
    <div><small>Per head (avg)</small><b id="tHead">₹0</b></div>
  </div>

  <h2>Settle up</h2>
  <div class="card settle" id="settle"><div class="empty">Nothing to settle yet</div></div>

  <h2>Balances</h2>
  <div class="card" id="balances"></div>

  <h2>Expenses</h2>
  <div class="card" id="list"><div class="empty">Loading…</div></div>
  <p class="note">Tap an expense to edit or delete it. Updates show up live on everyone's phone.</p>
</div>

<button class="fab" id="addBtn">+ Add expense</button>

<div class="overlay" id="ov">
  <form class="sheet" id="form" autocomplete="off">
    <h3 id="fTitle">Add expense</h3>
    <label for="fItem">What for</label>
    <input id="fItem" placeholder="e.g. Ferry tickets, dinner, villa" required maxlength="80">
    <label for="fAmt">Amount (₹)</label>
    <input id="fAmt" type="number" inputmode="decimal" min="0" step="0.01" required>
    <label>Paid by</label>
    <div class="chips" id="fPaid"></div>
    <label>Split between</label>
    <div class="chips" id="fSplit"></div>
    <label for="fDate">Date</label>
    <input id="fDate" type="date">
    <label for="fNote">Note (optional)</label>
    <input id="fNote" maxlength="120">
    <div class="err" id="fErr"></div>
    <div class="btns">
      <button type="button" class="btn ghost" id="cancel">Cancel</button>
      <button type="submit" class="btn primary" id="save">Save</button>
    </div>
    <div class="btns" id="delRow" style="display:none">
      <button type="button" class="btn danger" id="del">Delete this expense</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ssnxyrjoyuarkknepyyw.supabase.co";
const SUPABASE_KEY = "sb_publishable_S6QoTO2OnXqrQO4vq4hQwg_at6SR7hg";
const TABLE = "alibaug_expenses";
const PEOPLE = ["Arnab","Anushka","Dhruti"];
const $ = id => document.getElementById(id);
const fmt = n => "₹" + Math.round(n).toLocaleString("en-IN");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let sb = null, expenses = [], editingId = null;
let paid = PEOPLE[0], split = new Set(PEOPLE);
try { const last = localStorage.getItem("alibaug_me"); if (PEOPLE.includes(last)) paid = last; } catch(_){}

function banner(msg){ const b=$("banner"); b.textContent=msg; b.style.display = msg ? "block" : "none"; }

function compute(){
  const bal = Object.fromEntries(PEOPLE.map(p=>[p,{paid:0,share:0}]));
  let total = 0;
  for (const e of expenses){
    const amt = Number(e.amount)||0;
    const who = (e.split||[]).filter(p=>PEOPLE.includes(p));
    if (!PEOPLE.includes(e.paid_by) || !who.length) continue;
    total += amt; bal[e.paid_by].paid += amt;
    for (const p of who) bal[p].share += amt / who.length;
  }
  return {bal,total};
}
function settleUp(bal){
  const cred=[], debt=[];
  for (const p of PEOPLE){ const n = bal[p].paid - bal[p].share;
    if (n > 0.5) cred.push({p,v:n}); else if (n < -0.5) debt.push({p,v:-n}); }
  cred.sort((a,b)=>b.v-a.v); debt.sort((a,b)=>b.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<debt.length && j<cred.length){
    const x=Math.min(debt[i].v,cred[j].v); out.push({from:debt[i].p,to:cred[j].p,amt:x});
    debt[i].v-=x; cred[j].v-=x; if(debt[i].v<0.5)i++; if(cred[j].v<0.5)j++;
  }
  return out;
}
function render(){
  const {bal,total} = compute();
  $("tTotal").textContent = fmt(total); $("tHead").textContent = fmt(total/PEOPLE.length);
  $("balances").innerHTML = PEOPLE.map(p=>{
    const n = bal[p].paid - bal[p].share;
    const cls = n>0.5?"pos":n<-0.5?"neg":"";
    const txt = n>0.5?"gets back "+fmt(n):n<-0.5?"owes "+fmt(-n):"all square";
    return `<div class="row"><div><div class="name">${p}</div><div class="sub">Paid ${fmt(bal[p].paid)} · Share ${fmt(bal[p].share)}</div></div><div class="${cls}">${txt}</div></div>`;
  }).join("");
  const s = settleUp(bal);
  $("settle").innerHTML = s.length
    ? s.map(t=>`<div class="row"><div><span class="name">${t.from}</span> <span class="arrow">→</span> <span class="name">${t.to}</span></div><div class="amt">${fmt(t.amt)}</div></div>`).join("")
    : `<div class="empty">${expenses.length ? "Everyone's settled 🎉" : "Nothing to settle yet"}</div>`;
  $("list").innerHTML = expenses.length ? expenses.map(e=>{
    const who = e.split||[];
    const splitTxt = who.length===PEOPLE.length ? "split 3 ways" : "split: "+who.join(", ");
    const d = e.spent_on ? new Date(e.spent_on+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}) : "";
    return `<div class="row exp" data-id="${esc(e.id)}"><div><div class="name">${esc(e.item)}</div><div class="sub">${esc(e.paid_by)} paid · ${esc(splitTxt)}${d?" · "+d:""}${e.note?" · "+esc(e.note):""}</div></div><div class="amt">${fmt(Number(e.amount)||0)}</div></div>`;
  }).join("") : `<div class="empty">No expenses yet. Tap “+ Add expense”.</div>`;
  document.querySelectorAll(".exp").forEach(el=>el.onclick=()=>openForm(el.dataset.id));
}
function drawChips(){
  $("fPaid").innerHTML = PEOPLE.map(p=>`<button type="button" class="chip ${p===paid?"on":""}" data-p="${p}">${p}</button>`).join("");
  $("fSplit").innerHTML = PEOPLE.map(p=>`<button type="button" class="chip ${split.has(p)?"on":""}" data-s="${p}">${p}</button>`).join("");
  $("fPaid").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{paid=b.dataset.p;drawChips();});
  $("fSplit").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const p=b.dataset.s; split.has(p)?split.delete(p):split.add(p); drawChips();});
}
function today(){ return new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10); }
function openForm(id){
  editingId = id || null;
  const e = id ? expenses.find(x=>x.id===id) : null;
  $("fTitle").textContent = e ? "Edit expense" : "Add expense";
  $("fItem").value = e?.item || ""; $("fAmt").value = e ? e.amount : "";
  $("fDate").value = e ? (e.spent_on||"") : today(); $("fNote").value = e?.note || "";
  if (e) paid = e.paid_by;
  split = new Set(e ? e.split : PEOPLE);
  $("fErr").textContent = "";
  $("delRow").style.display = e ? "flex" : "none";
  $("del").textContent = "Delete this expense"; $("del").dataset.confirm = "";
  drawChips(); $("ov").classList.add("open");
  if (!e) setTimeout(()=>$("fItem").focus(),50);
}
function closeForm(){ $("ov").classList.remove("open"); editingId=null; }
$("addBtn").onclick = ()=>openForm();
$("cancel").onclick = closeForm;
$("ov").onclick = e=>{ if(e.target===$("ov")) closeForm(); };

async function load(){
  if (!sb) return;
  const { data, error } = await sb.from(TABLE).select("*")
    .order("spent_on",{ascending:false,nullsFirst:false}).order("created_at",{ascending:false});
  if (error){ banner("Couldn't load expenses — check your connection."); return; }
  banner(""); expenses = data; render();
}

$("form").addEventListener("submit", async ev=>{
  ev.preventDefault();
  if (!sb){ $("fErr").textContent="Not connected. Check your internet and reload."; return; }
  const amount = Math.round(parseFloat($("fAmt").value)*100)/100;
  const item = $("fItem").value.trim();
  if (!item || !(amount>0)) { $("fErr").textContent="Add what it was for and an amount."; return; }
  if (!split.size) { $("fErr").textContent="Pick at least one person to split with."; return; }
  const body = { item, amount, paid_by: paid, split: PEOPLE.filter(p=>split.has(p)),
                 spent_on: $("fDate").value || null, note: $("fNote").value.trim() || null };
  try { localStorage.setItem("alibaug_me", paid); } catch(_){}
  $("save").disabled = true;
  const { error } = editingId
    ? await sb.from(TABLE).update(body).eq("id", editingId)
    : await sb.from(TABLE).insert(body);
  $("save").disabled = false;
  if (error){ $("fErr").textContent = "Couldn't save: " + error.message; return; }
  closeForm(); load();
});
$("del").onclick = async ()=>{
  const b=$("del");
  if (!b.dataset.confirm){ b.dataset.confirm="1"; b.textContent="Tap again to delete"; return; }
  const { error } = await sb.from(TABLE).delete().eq("id", editingId);
  if (error){ $("fErr").textContent="Couldn't delete: "+error.message; return; }
  closeForm(); load();
};

render();
try {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  load();
  sb.channel("alibaug").on("postgres_changes",{event:"*",schema:"public",table:TABLE},()=>load()).subscribe();
  setInterval(()=>{ if (document.visibilityState==="visible") load(); }, 20000);
  document.addEventListener("visibilitychange",()=>{ if (document.visibilityState==="visible") load(); });
} catch(e) {
  $("list").innerHTML = `<div class="empty">Couldn't connect. Check your internet and reload.</div>`;
}
</script>
</body>
</html>
